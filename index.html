<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTC Robot Viewer</title>
  <!-- Load Google Model Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
    }

    /* Custom Centered Loading Overlay Styling */
    .custom-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6; /* Bright blue spinning ring */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    .loading-text {
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <model-viewer 
    id="robotViewer"
    src="robot.glb" 
    alt="3D Model of FTC Robot"
    auto-rotate 
    camera-controls 
    shadow-intensity="0"
    orientation="0deg 270deg 0deg"
    environment-image="neutral"
    exposure="1.2"
    interpolation-decay="200"
    min-field-of-view="10deg"
    min-camera-orbit="auto auto 70%"
    max-camera-orbit="auto auto 200%">

    <!-- Custom Loading Slot -->
    <div slot="progress-bar" class="custom-loader">
      <div class="spinner"></div>
      <div class="loading-text">Robot Loading...</div>
    </div>

  </model-viewer>

  <script>
    const viewer = document.getElementById('robotViewer');

    viewer.addEventListener('load', () => {
      const materials = viewer.model.materials;
      materials.forEach((mat, index) => {
        const baseColor = mat.pbrMetallicRoughness;
        if (index % 4 === 0) {
          baseColor.setBaseColorFactor([0.1, 0.8, 0.4, 1.0]); // Mint Green
        } else if (index % 4 === 1) {
          baseColor.setBaseColorFactor([0.0, 0.4, 0.9, 1.0]); // Royal Blue
        } else if (index % 4 === 2) {
          baseColor.setBaseColorFactor([0.2, 0.9, 0.9, 1.0]); // Cyan
        } else {
          baseColor.setBaseColorFactor([0.1, 0.6, 0.2, 1.0]); // Forest Green
        }
      });
    });
  </script>

</body>
</html>
