<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTC Robot Viewer</title>
  <!-- Load Google Model Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      /* Removes all color and makes materials uniform silver/gray */
      filter: grayscale(100%) brightness(1.1) contrast(1.1);
    }
  </style>
</head>
<body>

  <model-viewer 
    src="robot.glb" 
    alt="3D Model of FTC Robot"
    auto-rotate 
    camera-controls 
    shadow-intensity="1"
    /* Rotates the model 90 degrees around the Y axis */
    orientation="0deg 90deg 0deg">
  </model-viewer>

</body>
</html>
