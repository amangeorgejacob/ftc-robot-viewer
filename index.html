<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTC Robot Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
    }
    model-viewer::part(default-progress-bar) {
      display: none;
    }
  </style>
</head>
<body>
  <model-viewer 
    id="robotViewer" 
    src="robot.glb" 
    alt="3D Model of FTC Robot" 
    auto-rotate 
    camera-controls 
    disable-zoom 
    disable-pan 
    shadow-intensity="0" 
    orientation="0deg 270deg 0deg">
  </model-viewer>
</body>
</html>
